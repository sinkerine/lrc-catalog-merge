[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrc-catalog-merge"
version = "0.1.0"
description = "Merge the latest Lightroom Classic catalog backups of several backup directories"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
lrc-catalog-merge = "lrc_catalog_merge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
